  student_id: 24B031911         # as in KBTU records, e.g. 24B031016
  github: Nurali-852              # your GitHub username, the one that owns the repo

assistant:
  tool: Claude               # e.g. ChatGPT, Claude, Gemini, Copilot
  model: Sonnet 5 (Low effort)              # the exact model name with its version. "ChatGPT" is not a model name.

counts:
  user_stories: 8  # how many stories you kept after your review (the task asks for 6-8)
  acceptance_criteria_sets: 3 (3, 5, 3)  # how many stories you wrote Given/When/Then criteria for

checker:
  # Numbers from YOUR last run of: python tests/check_requirements.py
  # They must add up to the number of checks it runs. Report them as they came out.
  # A FAIL you report and explain in lab-report.md costs you nothing. A hidden one costs the criterion.
  pass: 19
  fail: 4
  error: 0
  commit: 3dbe94c     # the commit you ran the checker at: git rev-parse --short HEAD
                       # (normally the commit just before you commit this file — that is fine)

assumptions:
  # The scenario does not settle these two. Decide, declare, and defend the decision in lab-report.md.
  # Either answer is acceptable. Not deciding is not.
  overlap_touching_bookings:   Allowed with [start, end) principle # allowed | not-allowed   (a booking ending 14:00 and one starting 14:00)
  exactly_two_hours: Allowed          # allowed | not-allowed   (a booking of exactly the maximum length)

traceability:
  # Use the IDs from requirements/traceability.md. Empty lists are allowed — if you claim full
  # coverage, the checker and I will test that claim.
  use_cases_not_covered: [none]    # e.g. [UC-05, UC-06]
  stories_not_traced: [US-04, US-05, US-06, US-07, US-08]       # e.g. [US-09]

review_findings:
  # Three or more. One line each, and each one names the ID it is about.
  # Worthless: "the AI made mistakes".
  # Worth everything: "UC-06 Send confirmation had no story behind it until I wrote US-07".
  - US-08 was the only one that differed from basic user scenarios. AI did it by itself because I stated about 2 hour rule as given in section 1.
  - AC-10 was slightly unneccessary, cause by default we should design system so that there is no option for the user to interact with other users' bookings. But it is also can be used as a good test
  - AI gave high priority to almost every scenario, cause it thinks that main events should not disturb flow of system. Such as unblocking room should not have high priority

honesty:
  can_explain_everything_submitted:  yes # yes | no   — "no" is an accepted answer, name the part in lab-report.md
  ai_usage_disclosed:  yes               # yes | no   — AI_USAGE.md is required every week
